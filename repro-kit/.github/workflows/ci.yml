name: CI - Repro Check

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt

      - name: System libs for R spatial
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdal-bin libgdal-dev libgeos-dev libproj-dev libudunits2-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install renv and restore
        run: |
          R -q -e 'install.packages("renv", repos="https://cloud.r-project.org")'
          R -q -e 'if (!dir.exists("renv")) renv::init(bare=TRUE)'
          R -q -e 'source("install.R")'

      - name: Render RMarkdown
        run: |
          R -q -e 'rmarkdown::render("reports/ssa_education_report.Rmd", output_format="html_document")'
